# Render Infrastructure-as-Code Blueprint
# Deploy both services in 1-click on Render: https://render.com
services:
  # 1. Isolation Forest Machine Learning Microservice
  - type: web
    name: trustguard-ml
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements-ml.txt && python ml_service.py --train
    startCommand: uvicorn ml_service:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8

  # 2. TrustGuard Fullstack Web Application (Node Express + React)
  - type: web
    name: trustguard-web
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/system/stats
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # Optional: Provide your MongoDB Atlas Connection String if desired
      - key: MONGO_DB_NAME
        value: trustguard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL
        value: 7d
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: trustguard-ml
          property: host
      - key: ML_TIMEOUT_MS
        value: 1500
      - key: ML_SCORE_WEIGHT
        value: 0.25
      - key: ENABLE_EMAIL_ALERTS
        value: true
      - key: SECURITY_ALERT_EMAIL
        value: kowshiga931@gmail.com
